<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EquiSense</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='7' fill='%230d0d0d'/%3E%3Cpath d='M8 20 L13 14 L17 17 L24 9' stroke='%233987e5' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='24' cy='9' r='2.4' fill='%23199e70'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="sparkgrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3987e5" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="#3987e5" stop-opacity="0"/>
  </linearGradient>
</defs></svg>
<header class="topbar">
  <div class="brand">Equi<span>Sense</span></div>
  <nav id="nav">
    <a href="#/dashboard" data-route="dashboard">Dashboard <kbd>gd</kbd></a>
    <a href="#/companies" data-route="companies">Companies <kbd>gc</kbd></a>
    <a href="#/portfolio" data-route="portfolio">Portfolio <kbd>gp</kbd></a>
    <a href="#/trading" data-route="trading">Trading <kbd>gt</kbd></a>
    <a href="#/research" data-route="research">Research <kbd>gr</kbd></a>
    <a href="#/markets" data-route="markets">Markets <kbd>gm</kbd></a>
    <a href="#/lab" data-route="lab">Lab <kbd>gl</kbd></a>
  </nav>
  <button id="palette-btn" title="Command palette">Search / Commands <kbd>Ctrl K</kbd></button>
  <button id="theme-btn" title="Toggle theme">◐</button>
  <button id="help-btn" title="Keyboard shortcuts">?</button>
  <button id="sync-btn" title="Realign derived data with what the database already knows — rebuilds the snapshot, registers today's forecasts, scores what is due and lets autopilot act. Seconds; contacts no provider.">⟳ Sync</button>
  <button id="refresh-btn" class="primary" title="Full staged pipeline: download prices, macro and fundamentals, then recompute every hypothesis. Minutes.">⟳ Refresh</button>
</header>
<div id="toasts" class="toasts"></div>

<div class="status-strip" id="status-strip">connecting…</div>

<main id="app"><div class="loading">Loading…</div></main>

<div id="palette" class="overlay" hidden>
  <div class="palette-box">
    <input id="palette-input" placeholder="Type a ticker, company, or command…" autocomplete="off">
    <div id="palette-list"></div>
  </div>
</div>

<div id="help-overlay" class="overlay" hidden>
  <div class="palette-box" style="padding:16px 18px">
    <div style="font-weight:700;margin-bottom:8px">Keyboard shortcuts</div>
    <div class="help-grid" id="help-grid"></div>
  </div>
</div>

<div id="drawer" class="drawer" hidden>
  <div class="drawer-head">
    <strong>Pipeline refresh</strong>
    <button id="drawer-close">✕</button>
  </div>
  <div id="drawer-body"></div>
</div>

<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
