[project]
name = "equisense"
version = "0.1.0"
description = "Explainable, personalized equity-analysis workspace for the Indian market"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "anthropic>=0.90",
    "yfinance>=0.2.40",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]  # hosted deployments (DEPLOYMENT.md)

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["equisense*"]
